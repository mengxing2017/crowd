name: Check
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - run: make check-backend
      - run: make test-embedded
      - run: make test-business
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@11.22.0
      - run: make install
      - run: make check-web
      - run: pnpm --dir frontend --filter @crowd/web exec playwright install --with-deps chromium
      - run: pnpm --dir frontend --filter @crowd/web test:e2e
        env:
          CROWD_WEB_E2E_PREVIEW: '1'
