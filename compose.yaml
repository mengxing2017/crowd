services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crowd
      POSTGRES_USER: crowd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crowd -d crowd"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    image: ${API_IMAGE:-crowd-api:local}
    environment:
      CROWD_BIND_ADDR: 0.0.0.0:8080
      CROWD_WECHAT_APP_ID: ${CROWD_WECHAT_APP_ID:-}
      CROWD_WECHAT_APP_SECRET: ${CROWD_WECHAT_APP_SECRET:-}
      CROWD_BOOTSTRAP_ADMIN_USERNAME: ${CROWD_BOOTSTRAP_ADMIN_USERNAME:-}
      CROWD_BOOTSTRAP_ADMIN_PASSWORD: ${CROWD_BOOTSTRAP_ADMIN_PASSWORD:-}
      CROWD_BOOTSTRAP_PLATFORM_ID: ${CROWD_BOOTSTRAP_PLATFORM_ID:-}
      CROWD_SESSION_SECONDS: ${CROWD_SESSION_SECONDS:-7200}
      CROWD_PROMOTION_ORIGIN: ${CROWD_PROMOTION_ORIGIN:-}
      CROWD_DATABASE_HOST: postgres
      CROWD_DATABASE_PORT: "5432"
      CROWD_DATABASE_NAME: crowd
      CROWD_DATABASE_USER: crowd
      CROWD_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      CROWD_DATABASE_SSL_MODE: disable
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  web:
    image: ${WEB_IMAGE:-crowd-web:local}
    environment:
      CROWD_WEB_LISTEN: ${CROWD_WEB_LISTEN:-:80}
      CROWD_API_UPSTREAM: ${CROWD_API_UPSTREAM:-api:8080}
    ports: ["127.0.0.1:${WEB_PORT:-8088}:80"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres-data:
